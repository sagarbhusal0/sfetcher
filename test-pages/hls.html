<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sfetcher test: HLS VOD</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
<h1>HLS VOD (blob-backed video element)</h1>
<video id="v" controls width="640"></video>
<script>
  // Public Mux test stream. For fully local testing, generate a VOD playlist
  // with ffmpeg and serve it from this directory instead.
  const src = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
  const video = document.getElementById('v');
  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
  }
</script>
<p>Expected: video.src is blob: — popup must still list the hls manifest
(via resource-timing + network observation once host access is granted).</p>
</body>
</html>
